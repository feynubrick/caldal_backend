services:
  app_backend_db:
    image: postgres:17-bookworm
    volumes:
      - app_backend_db_data:/var/lib/postgresql/data
      - ./deploy/postgres/config/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d/
      - ./deploy/postgres/config/pg_hba.conf:/etc/postgresql/pg_hba.conf
    ports:
      - "5440:5432"
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POWERSYNC_PASSWORD: ${POWERSYNC_SOURCE_DB_PASSWORD}
    restart: always

  powersync_storage:
    image: mongo:7.0
    volumes:
      - powersync_storage_data:/data/db
      - ./deploy/powersync/mongo/keyfile:/data/keyfile
    ports:
      - "27117:27017"
    entrypoint:
      - bash
      - -c
      - |
        chmod 400 /data/keyfile
        chown 999:999 /data/keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /data/keyfile
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${POWERSYNC_STORAGE_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${POWERSYNC_STORAGE_PASSWORD}

  # Initializes the MongoDB replica set.
  # This service will not usually be actively running
  powersync_storage_rs_init:
    image: mongo:7.0
    depends_on:
      - powersync_storage
    volumes:
      - ./deploy/powersync/mongo/init-replica.sh:/init-replica.sh
      - ./deploy/powersync/mongo/keyfile:/data/keyfile:ro
    entrypoint: ["bash", "/init-replica.sh"]
    restart: "no"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${POWERSYNC_STORAGE_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${POWERSYNC_STORAGE_PASSWORD}

  web:
    build: .
    depends_on:
      - app_backend_db
    volumes:
      - .:/app
    ports:
      - "8010:8000"
    env_file:
      - local.env
    environment:
      DATABASE_HOST: app_backend_db
      DATABASE_PORT: 5432

  powersync:
    image: journeyapps/powersync-service:1.3.7
    depends_on:
      - powersync_storage
      - app_backend_db
      - web
    volumes:
      - ./deploy/powersync/config:/config
    ports:
      - "8011:8011"
    command: [ "start", "-r", "unified" ]
    environment:
      POWERSYNC_CONFIG_PATH: /config/config.yaml
      PS_SOURCE_DB_HOST: app_backend_db
      PS_SOURCE_DB_PORT: 5432
      PS_SOURCE_DB_DATABASE: ${DATABASE_NAME}
      PS_SOURCE_DB_USERNAME: powersync_role
      PS_SOURCE_DB_PASSWORD: ${POWERSYNC_SOURCE_DB_PASSWORD}
      PS_STORAGE_USERNAME: ${POWERSYNC_STORAGE_USERNAME}
      PS_STORAGE_PASSWORD: ${POWERSYNC_STORAGE_PASSWORD}
      PS_STORAGE_CONNECTION_URI: mongodb://${POWERSYNC_STORAGE_USERNAME}:${POWERSYNC_STORAGE_PASSWORD}@powersync_storage:27017
      PS_JWK_KEY: ${POWERSYNC_JWK_KEY}

volumes:
  app_backend_db_data:
  powersync_storage_data:
